timezone: Europe/Moscow

crossing:
  name: "Ефремов, ж/д переезд"
  lat: 53.141
  lon: 38.092

database: "data/crossing.db"
schedule_path: "data/crossing_schedule.yaml"
plausibility_path: "data/plausibility.yaml"

schedule_source_url: "https://raw.githubusercontent.com/Difiramb/Railway-Trecker/main/data/crossing_schedule.yaml"
plausibility_source_url: "https://raw.githubusercontent.com/Difiramb/Railway-Trecker/main/data/plausibility.yaml"

