timezone: Europe/Moscow

crossing:
  name: "Ефремов, ж/д переезд"
  lat: 53.141
  lon: 38.092
  # Схема путей — только для будущего анализа, из сообщений пользователей не собирается.
  # 1-й и 2-й пути: пассажирские и грузовые.
  # 3-й путь: технические и грузовые.
  tracks:
    - id: 1
      allowed_types: ["passenger", "freight"]
    - id: 2
      allowed_types: ["passenger", "freight"]
    - id: 3
      allowed_types: ["technical", "freight"]

database: "data/crossing.db"
schedule_path: "data/crossing_schedule.yaml"
plausibility_path: "data/plausibility.yaml"

schedule_source_url: "https://raw.githubusercontent.com/Difiramb/Railway-Trecker/main/data/crossing_schedule.yaml"
plausibility_source_url: "https://raw.githubusercontent.com/Difiramb/Railway-Trecker/main/data/plausibility.yaml"

prediction:
  closed_threshold: 0.65
  open_threshold: 0.35
  report_ttl_min: 90
  weights:
    user_closed: 1.0
    user_closed_unknown_wait: 0.7
    user_open: 1.0
    yandex: 0.8
    schedule: 0.4
    peak: 0.35

features:
  allow_train_type_input: true

yandex:
  enabled: false
  endpoint: ""
  api_key_env: "YANDEX_API_KEY"
  jam_threshold_m: 150
  jam_length_to_wait_min_per_100m: 0.7

vk:
  token_env: "VK_TOKEN"
  group_id: 242810724

rate_limit:
  incoming_max: 3           # не больше 3 сообщений от одного user_id
  incoming_window_sec: 10   # за 10 секунд
  outgoing_rate_per_sec: 18 # глобально не больше 18 запросов/сек (лимит VK — 20)
  outgoing_burst: 25        # максимум «всплеск» исходящих
