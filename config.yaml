  enabled: false
  endpoint: ""
  api_key_env: "YANDEX_API_KEY"
  jam_threshold_m: 150
  jam_length_to_wait_min_per_100m: 0.7

vk:
  token_env: "VK_TOKEN"
  group_id: 242810724
