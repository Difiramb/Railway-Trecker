# Большие окна — приор по времени суток.
schedule:
  - id: "night"
    start: "03:00"
    end: "04:00"
    duration_min: [10, 20]
    probability: 0.85

  - id: "morning"
    start: "07:30"
    end: "08:10"
    duration_min: [10, 20]
    probability: 0.85

  - id: "noon"
    start: "12:00"
    end: "13:00"
    duration_min: [15, 30]
    probability: 0.75

  - id: "every2h_14"
    start: "14:00"
    end: "15:00"
    duration_min: [10, 40]
    probability: 0.65

  - id: "every2h_16"
    start: "16:00"
    end: "17:00"
    duration_min: [10, 40]
    probability: 0.65

  - id: "every2h_18"
    start: "18:00"
    end: "19:00"
    duration_min: [10, 40]
    probability: 0.65

  - id: "evening"
    start: "21:00"
    end: "21:40"
    duration_min: [10, 20]
    probability: 0.75

# Дополнения — короткие «пики» в конкретные часы.
# Работают поверх schedule, не отменяют и не заменяют его.
peaks:
  - id: "peak_0700"
    time: "07:00"
    window_min: 5
    duration_min: [10, 20]
    probability: 0.55

  - id: "peak_0845"
    time: "08:45"
    window_min: 5
    duration_min: [10, 20]
    probability: 0.55

  - id: "peak_1000"
    time: "10:00"
    window_min: 5
    duration_min: [10, 25]
    probability: 0.55

  - id: "peak_1400"
    time: "14:00"
    window_min: 5
    duration_min: [10, 40]
    probability: 0.55

  - id: "peak_1700"
    time: "17:00"
    window_min: 5
    duration_min: [10, 40]
    probability: 0.55

  - id: "peak_1900"
    time: "19:00"
    window_min: 5
    duration_min: [10, 20]
    probability: 0.55